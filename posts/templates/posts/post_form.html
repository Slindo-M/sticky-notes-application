<!--posts/templates/posts/post_form.html-->
{% extends 'base.html' %}
{% block title %}Note Form{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{{ title }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save</button>
        {% if delete %}
            <a href="{% url 'sticky_note_display' %}" class="cancel-btn">Cancel</a>
        {% else %}
            <a href="{% url 'sticky_note_display' %}" class="cancel-btn">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
